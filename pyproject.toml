[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mona-ai-crawler-check"
version = "0.1.0"
description = "Check whether AI crawlers can read and cite a website"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
mona-ai-crawler-check = "mona_ai_crawler_check.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
